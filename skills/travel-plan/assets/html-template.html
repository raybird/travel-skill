<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FF6B6B">
    <title>{{TRIP_NAME}}</title>
    <script>document.documentElement.classList.add('js');</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
    <style>
{{STYLES}}
    </style>
</head>
<body>
    <header class="trip-header">
        <div class="header-content">
            <h1>{{TRIP_NAME}}</h1>
            <p class="trip-meta">{{TRIP_META}}</p>
            {{TRAVELER_LEGEND}}
        </div>
    </header>

    <nav class="trip-nav" aria-label="行程導覽">
        <div class="nav-inner">
            <div class="day-tabs" role="tablist">
                {{DAY_TABS}}
            </div>
            {{PLAN_TOGGLE}}
            <div class="layout-toggle" role="group" aria-label="版面">
                <button type="button" class="layout-btn" data-layout="list" aria-pressed="true">📋 清單</button>
                <button type="button" class="layout-btn" data-layout="map" aria-pressed="false">🗺️ 路線圖</button>
            </div>
        </div>
    </nav>

    <main class="container">
        {{ROUTE_MAP}}

        {{DAY_PANELS}}

        <section class="day-panel info-panel" id="info" role="tabpanel" aria-labelledby="tab-info">
            <div class="day-header">
                <span class="day-badge">須知</span>
                <h2 class="day-title">行前須知</h2>
            </div>
            {{OVERVIEW}}
            <section class="info-card tips-section">
                <h2>旅遊注意事項</h2>
                <ul class="tips-list">
                    {{TRAVEL_TIPS}}
                </ul>
            </section>
        </section>

        <section class="actions-section">
            <button type="button" class="btn btn-primary" onclick="copyAll()">複製全部行程</button>
            <button type="button" class="btn btn-secondary" onclick="shareViaLINE()">分享到 LINE</button>
        </section>
    </main>

    <footer class="footer">
        <p>此行程由 Travel Plan Agent 產生</p>
    </footer>

    <script>
        const tripName = {{TRIP_NAME_JSON}};
        const tripDate = {{DATE_JSON}};
        const root = document.documentElement;

        function copyAll() {
            // Read hidden days and plans too: drop the tab/plan switching styles for a moment
            root.classList.remove('js');
            const content = document.querySelector('main').innerText;
            root.classList.add('js');
            navigator.clipboard.writeText(content).then(() => {
                alert('已複製到剪貼簿！');
            }).catch(() => {
                alert('複製失敗，請手動複製');
            });
        }

        function shareViaLINE() {
            const url = encodeURIComponent(window.location.href);
            const text = encodeURIComponent(tripName + '\n' + tripDate + '\n查看完整行程：');
            window.open('https://line.me/R/msg/text/?' + text + '%20' + url, '_blank', 'noopener');
        }

        (function () {
            const tabs = Array.from(document.querySelectorAll('.day-tab'));
            const panels = Array.from(document.querySelectorAll('.day-panel'));
            const planButtons = Array.from(document.querySelectorAll('.plan-btn'));
            const layoutButtons = Array.from(document.querySelectorAll('.layout-btn'));
            const nav = document.querySelector('.trip-nav');
            const main = document.querySelector('main');
            const map = document.getElementById('route-map');
            const viewport = map.querySelector('.rm-viewport');
            const svg = map.querySelector('.rm-svg');
            const lanes = Array.from(svg.querySelectorAll('.rm-lane'));
            const nodes = Array.from(svg.querySelectorAll('.rm-node'));
            const notes = Array.from(map.querySelectorAll('.rm-note'));
            const detail = map.querySelector('.rm-detail');
            const vertical = map.querySelector('.rm-vertical');
            const verticalDays = Array.from(vertical.querySelectorAll('.rv-day'));
            const verticalNodes = Array.from(vertical.querySelectorAll('.rv-node'));
            const storeKey = 'travel-plan:' + tripName + ':';
            let current = '';

            function store(key, value) {
                try { localStorage.setItem(storeKey + key, value); } catch (e) {}
            }

            function stored(key) {
                try { return localStorage.getItem(storeKey + key); } catch (e) { return null; }
            }

            function isMap() {
                return root.dataset.layout === 'map';
            }

            function targets() {
                return tabs.map((tab) => tab.dataset.target)
                    .filter((id) => isMap() || panels.some((panel) => panel.id === id));
            }

            function focusDay(id) {
                const day = id.startsWith('day-') ? id.slice(4) : '';
                [svg, vertical].forEach((element) => {
                    if (day) {
                        element.dataset.focus = day;
                    } else {
                        delete element.dataset.focus;
                    }
                });
                lanes.forEach((lane) => lane.classList.toggle('is-focus', lane.dataset.day === day));
                verticalDays.forEach((item) => item.classList.toggle('is-focus', item.dataset.day === day));
                notes.forEach((note) => { note.hidden = note.dataset.day !== (day || 'overview'); });
            }

            function revealLane(id) {
                const lane = lanes.find((item) => 'day-' + item.dataset.day === id);
                // Phones show the vertical route instead of the SVG
                if (!lane || viewport.offsetParent === null) return false;
                const rect = lane.getBoundingClientRect();
                if (rect.top < nav.offsetHeight || rect.bottom > window.innerHeight) {
                    window.scrollBy({ top: rect.top - nav.offsetHeight - 96, behavior: 'smooth' });
                }
                return true;
            }

            function showPanel(id) {
                const available = targets();
                if (!available.includes(id)) {
                    id = available.includes(current) ? current : (available.find((item) => item !== 'overview') || '');
                }
                current = id;
                root.dataset.panel = id;
                panels.forEach((panel) => panel.classList.toggle('is-active', panel.id === id));
                tabs.forEach((tab) => {
                    const selected = tab.dataset.target === id;
                    tab.setAttribute('aria-selected', selected ? 'true' : 'false');
                    tab.tabIndex = selected ? 0 : -1;
                    if (selected) {
                        tab.scrollIntoView({ block: 'nearest', inline: 'center' });
                    }
                });
                focusDay(id);
            }

            function setPlan(plan) {
                root.dataset.plan = plan;
                planButtons.forEach((button) => {
                    button.setAttribute('aria-pressed', button.dataset.plan === plan ? 'true' : 'false');
                });
                store('plan', plan);
            }

            function setLayout(layout) {
                root.dataset.layout = layout;
                layoutButtons.forEach((button) => {
                    button.setAttribute('aria-pressed', button.dataset.layout === layout ? 'true' : 'false');
                });
                store('layout', layout);
                showPanel(current);
            }

            function scrollToMain() {
                const top = main.getBoundingClientRect().top + window.scrollY - nav.offsetHeight;
                if (window.scrollY > top) {
                    window.scrollTo({ top: top, behavior: 'smooth' });
                }
            }

            function selectNode(node) {
                const source = document.getElementById('seg-' + node.dataset.seg);
                if (!source) return;
                nodes.forEach((item) => item.setAttribute('aria-pressed', item === node ? 'true' : 'false'));
                const card = source.cloneNode(true);
                card.removeAttribute('id');
                const back = document.createElement('button');
                back.type = 'button';
                back.className = 'btn btn-secondary rm-open-list';
                back.textContent = '📋 在清單中查看';
                back.addEventListener('click', () => {
                    setLayout('list');
                    showPanel('day-' + node.dataset.seg.split('-')[0].slice(1));
                    source.scrollIntoView({ block: 'start', behavior: 'smooth' });
                });
                detail.replaceChildren(card, back);
                detail.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }

            tabs.forEach((tab) => {
                tab.addEventListener('click', () => {
                    showPanel(tab.dataset.target);
                    try { history.replaceState(null, '', '#' + tab.dataset.target); } catch (e) {}
                    if (!(isMap() && revealLane(current))) {
                        scrollToMain();
                    }
                });
                tab.addEventListener('keydown', (event) => {
                    const step = { ArrowRight: 1, ArrowLeft: -1 }[event.key];
                    if (!step) return;
                    const visible = tabs.filter((item) => item.offsetParent !== null);
                    const next = visible[(visible.indexOf(tab) + step + visible.length) % visible.length];
                    next.focus();
                    next.click();
                });
            });

            planButtons.forEach((button) => {
                button.addEventListener('click', () => setPlan(button.dataset.plan));
            });

            layoutButtons.forEach((button) => {
                button.addEventListener('click', () => setLayout(button.dataset.layout));
            });

            function toggleStop(button) {
                const open = button.getAttribute('aria-expanded') !== 'true';
                verticalNodes.forEach((other) => {
                    if (other !== button && other.getAttribute('aria-expanded') === 'true') {
                        other.setAttribute('aria-expanded', 'false');
                        document.getElementById(other.getAttribute('aria-controls')).hidden = true;
                    }
                });
                const panel = document.getElementById(button.getAttribute('aria-controls'));
                if (open && !panel.firstChild) {
                    const source = document.getElementById('seg-' + button.dataset.seg);
                    if (source) {
                        const card = source.cloneNode(true);
                        card.removeAttribute('id');
                        panel.append(card);
                    }
                }
                panel.hidden = !open;
                button.setAttribute('aria-expanded', open ? 'true' : 'false');
                if (open) {
                    button.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            }

            verticalNodes.forEach((button) => {
                button.addEventListener('click', () => toggleStop(button));
            });

            nodes.forEach((node) => {
                node.addEventListener('click', () => selectNode(node));
                node.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        selectNode(node);
                    }
                });
            });

            const savedPlan = stored('plan');
            setPlan(savedPlan === 'rain' ? 'rain' : 'sun');
            current = decodeURIComponent(location.hash.slice(1));
            setLayout(stored('layout') === 'map' ? 'map' : 'list');
        })();
    </script>
</body>
</html>
